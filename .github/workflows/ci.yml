name: CI

# npm test 실행 설정
on:
  push:
    branches: [main, develop]      # 대상 브랜치
  pull_request:

# 같은 ref 중복 실행 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']   # 지원 Node 버전
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm               # 의존성 캐시

      - run: npm ci                # 의존성 설치
      - run: npm test              # 테스트 실행

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '24'         # 커버리지 임계 플래그 지원
          cache: npm

      - run: npm ci                  # 의존성 설치
      - run: npm run test:coverage   # 로직 코어 80% 미만이면 실패
