name: Publish

# main 푸시 시 npm 배포 (package.json 버전이 새로 올랐을 때만)
on:
  push:
    branches: [main]      # main 업데이트 트리거

permissions:
  id-token: write   # OIDC 토큰 발급 (trusted publishing)
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24'                  # npm 11.x 동봉
          registry-url: 'https://registry.npmjs.org'

      - run: npm install -g npm@latest         # npm >=11.5.1 보장(OIDC 요건)
      - run: npm ci                            # 의존성 설치
      - run: npm test                          # 배포 전 테스트 게이트

      - id: ver                                # 현재 버전이 이미 배포됐는지 확인
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "tokenphage@$v" version > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"; echo "already published: $v (skip)"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"; echo "new version: $v"
          fi

      - if: steps.ver.outputs.new == 'true'    # 새 버전일 때만 배포
        run: npm publish                       # OIDC 인증, provenance 자동
